name: Build price history

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Update card prices"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "scripts/build_history.py"
      - ".github/workflows/history.yml"

permissions:
  contents: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore archive cache
        uses: actions/cache@v4
        with:
          path: archive-cache
          key: tcgcsv-archive-${{ github.run_id }}
          restore-keys: tcgcsv-archive-
      - name: Tools
        run: which 7z || (sudo apt-get update -q && sudo apt-get install -y -q p7zip-full)
      - name: Build history
        run: python scripts/build_history.py
      - name: Commit
        run: |
          git config user.name "holovalue-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update price history $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
